<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA — AI Hologram Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- FALLING STARS -->
    <div class="falling-star"></div>
    <div class="falling-star"></div>
    <div class="falling-star"></div>

    <!-- WEBCAM (hidden) -->
    <video id="webcam" autoplay playsinline></video>

    <!-- DEBUG INFO -->
    <div id="debug-info">
      <div>Wajah: <span id="dbg-face">❌</span></div>
      <div>Tangan Kanan: <span id="dbg-right">❌</span></div>
      <div>Tangan Kiri: <span id="dbg-left">❌</span></div>
      <div>Pose: <span id="dbg-pose">❌</span></div>
    </div>

    <!-- ARIA LABEL TOP -->
    <div id="aria-label">
      <span class="aria-name">ARIA</span>
      <span class="aria-sub">AI Hologram Assistant</span>
      <div class="aria-status-dot" id="aria-dot"></div>
    </div>

    <!-- HISTORY BUTTON (top right) -->
    <button
      id="history-btn"
      title="Riwayat chat"
      aria-label="Riwayat percakapan"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
        />
      </svg>
      <span id="history-badge" class="hidden">0</span>
    </button>

    <!-- HISTORY PANEL -->
    <div id="history-panel" class="closed">
      <div class="history-header">
        <span class="history-title">Riwayat Percakapan</span>
        <button id="history-clear" title="Hapus riwayat">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M9 6V4h6v2" />
          </svg>
        </button>
      </div>
      <div id="history-list">
        <div id="history-empty">Belum ada percakapan.</div>
      </div>
    </div>

    <!-- MAIN UI -->
    <div id="ui-container">
      <!-- CHAT DISPLAY -->
      <div id="chat-display">
        <p id="status-text">Status: Menunggu...</p>
        <p id="chat-text">Tekan mic atau ketik pesan untuk mulai bicara!</p>
      </div>

      <!-- CONTROLS ROW -->
      <div id="controls-row">
        <!-- MIC BUTTON -->
        <button id="btn-mic" aria-label="Mulai/stop rekam suara">
          <svg
            id="mic-icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
          <div class="mic-ring" id="mic-ring"></div>
        </button>

        <!-- TEXT INPUT -->
        <div id="input-wrapper">
          <input
            id="manual-input"
            type="text"
            placeholder="Ketik pesan ke Aria..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="btn-send" aria-label="Kirim pesan">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- SCAN LINE OVERLAY -->
    <div id="scanline"></div>

    <!-- CORNER DECORATIONS -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
